<style>
/* Layout: mobile-first single column app, bottom tab bar, cards per training block */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --ink:#12161C; --mute:#5B6470; --line:#D9DEE4;
  --accent:#E8470F; --accent-ink:#FFFFFF; --soft:#F5F6F8; --ok:#1E8E5A; --warn:#B7791F;
  --display:'Archivo','Noto Sans KR',system-ui,sans-serif; --body:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#171B21; --ink:#ECEFF3; --mute:#98A2AF; --line:#272D36;
  --accent:#FF6A33; --accent-ink:#12161C; --soft:#1D222A; --ok:#3CC38A; --warn:#E3A92F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --ink:#ECEFF3; --mute:#98A2AF; --line:#272D36;
  --accent:#FF6A33; --accent-ink:#12161C; --soft:#1D222A; --ok:#3CC38A; --warn:#E3A92F; color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.hero{display:block;width:min(78%,300px);margin:0 auto;background:#fff;border-radius:20px;padding:10px}
.logo{width:40px;height:40px;flex:none;border-radius:10px;object-fit:cover;background:#000}.brandrow{display:flex;align-items:center;gap:10px}nav.tabs svg{width:22px;height:22px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--accent);margin-top:4px}
.who{font-size:13px;color:var(--mute);text-align:right;min-width:0}
.who b{color:var(--ink);display:block;font-size:14px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--mute);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.acc{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.card h3{margin:0 0 10px;font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font-family:var(--display);font-weight:900;font-size:28px;line-height:1.1;margin:8px 0 2px;text-wrap:balance}
.sub{color:var(--mute);font-size:13px}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) 72px minmax(0,1.6fr);gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row.typed{grid-template-columns:minmax(0,1.1fr) 72px minmax(0,1.6fr)}
.row .nm{font-weight:700;font-size:14px;min-width:0}
.row .nm input{margin-top:4px;width:100%}
.colhead{display:grid;grid-template-columns:minmax(0,1.1fr) 72px minmax(0,1.6fr);gap:8px;font-size:11px;letter-spacing:.1em;color:var(--mute);font-weight:700;text-transform:uppercase;padding-bottom:4px}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 10px;min-width:0}
textarea{min-height:96px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.7}
.rate{display:flex;gap:6px}
.rate button{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-weight:700;font-variant-numeric:tabular-nums}
.rate button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cond{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0}
.cond label{font-size:14px;font-weight:700}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--ink);color:var(--bg);width:100%}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.attend{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.attend .big{font-family:var(--display);font-weight:900;font-size:22px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{display:flex;gap:6px;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--mute)}
nav.tabs button[aria-current=page]{background:var(--soft);color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;text-align:center;color:var(--mute);font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:var(--soft);font-size:13px;font-variant-numeric:tabular-nums;position:relative;padding:0}
.cal button.blank{background:none;pointer-events:none}
.cal button.att{background:var(--accent);color:var(--accent-ink);font-weight:800}
.cal button.log{border-color:var(--accent);color:var(--accent);font-weight:700}
.cal button.sel{outline:2px solid var(--ink);outline-offset:1px}
.cal button.today::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-family:var(--display);font-weight:800;font-size:17px}
.mnav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-family:var(--display);font-size:26px;font-weight:900;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.mem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:8px}
.mem .av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}
.mem .t{flex:1;min-width:0}.mem .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem .t span{font-size:12px;color:var(--mute)}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px;background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.banner.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.matrix{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:8px}
.matrix table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.matrix th,.matrix td{padding:0;text-align:center;height:30px;min-width:26px}
.matrix th{color:var(--mute);font-weight:700}
.matrix th.nm,.matrix td.nm{position:sticky;left:0;background:var(--surface);text-align:left;padding:0 10px;min-width:84px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1;border-right:1px solid var(--line);font-weight:700}
.matrix td.c i{display:block;width:16px;height:16px;border-radius:5px;margin:auto;background:var(--soft)}
.matrix td.c i.a{background:var(--accent)}
.matrix td.c i.l{background:none;border:2px solid var(--accent)}
.matrix td.tot{padding:0 8px;font-weight:800}
.demo{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:6px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo button{border:0;border-radius:8px;padding:6px 10px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13px;z-index:20;max-width:90vw}
.save{font-size:12px;color:var(--mute)}
.center{max-width:420px;margin:12vh auto 0;text-align:center}
.center .card{text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.two label{font-size:12px;color:var(--mute);font-weight:700;display:block;margin-bottom:4px}.coach{border-left:4px solid var(--accent)}
.check{display:flex;align-items:center;gap:10px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--accent)}
@media (max-width:420px){.cond{grid-template-columns:78px minmax(0,1fr)}.row,.colhead{grid-template-columns:minmax(0,1fr) 60px minmax(0,1.3fr)}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease both}@keyframes in{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

function tabsHtml(){
  var role=activeRole();
  var t=role==='admin'?[['members','회원'],['matrix','출석표']]:[['today','오늘'],['history','기록']];
  return '<nav class="tabs"><div class="in">'+t.map(function(x){return '<button data-tab="'+x[0]+'"'+(S.tab===x[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[x[0]]+'</svg>'+x[1]+'</button>'}).join('')+'</div></nav>';
}
function calendarHtml(map){
  var p=S.month.split('-');var first=new Date(+p[0],+p[1]-1,1).getDay();var ds=monthDates(S.month);
  var h='<div class="mnav"><button data-act="mprev" aria-label="이전 달">‹</button><span>'+monthLabel(S.month)+'</span><button data-act="mnext" aria-label="다음 달">›</button></div><div class="cal">';
  DOW.forEach(function(d){h+='<div class="dow">'+d+'</div>'});
  for(var i=0;i<first;i++)h+='<button class="blank" tabindex="-1"></button>';
  ds.forEach(function(d){var e=map[d];var c=(e&&e.attended)?' att':(hasLog(e)?' log':'');
    h+='<button data-date="'+d+'" class="'+c+(d===TODAY?' today':'')+(d===S.date?' sel':'')+'">'+(+d.slice(8))+'</button>'});
  return h+'</div>';
}
function statsHtml(map){
  return '<div class="stats"><div class="stat"><b>'+countMonth(map,S.month)+'</b><span>이번 달 출석</span></div>'+
   '<div class="stat"><b>'+streak(map)+'</b><span>연속 출석(일)</span></div>'+
   '<div class="stat"><b>'+monthHours(map)+'</b><span>이번 달 운동(시간)</span></div></div>';
}
function statusHtml(){
  var d=S.draft;if(!d)return '';
  if(d.confirmedAt)return '<div class="banner ok">✓ 본인 확인 완료 · '+new Date(d.confirmedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</div>';
  if(d.adminEditedAt)return '<div class="banner">관리자가 내용을 수정했어요. 내용을 확인하고 본인 확인을 눌러 주세요.</div>';
  return hasLog(d)?'<div class="banner">아직 본인 확인 전이에요. 아래에서 확인을 눌러 마무리하세요.</div>':'';
}
function editorHtml(){
  ensureDraft();var d=S.draft;var role=activeRole();var admin=role==='admin'&&viewUid()!==S.uid;
  var h='<div id="editor">';
  h+='<div class="card"><div class="attend"><div><div class="sub">'+pretty(S.date)+'</div><div class="big">'+(d.attended?'출석 완료':'출석 전')+'</div>'+
    (d.attended&&d.checkInAt?'<div class="sub">'+new Date(d.checkInAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 체크</div>':'')+'</div>'+
    '<button class="btn sm '+(d.attended?'ghost':'acc')+'" data-act="attend">'+(d.attended?(admin?'출석 취소':'출석 취소'):'출석 체크')+'</button></div></div>';
  h+='<div class="card"><h3>Sleep · Recovery</h3><div class="cond"><label for="f-sleep">수면 시간</label><input id="f-sleep" type="number" inputmode="decimal" step="0.5" min="0" max="24" placeholder="예) 7.5" data-f="sleepH" value="'+esc(d.sleepH)+'"></div>'+
    '<div class="cond"><label>회복도</label>'+rateHtml('recovery',d.recovery)+'</div></div>';
  h+='<div class="card"><h3>Condition <span class="pill">1 나쁨 · 5 좋음</span></h3>'+CONDS.map(function(c){return '<div class="cond"><label>'+c[1]+'</label>'+rateHtml('cond.'+c[0],d.cond[c[0]])+'</div>'}).join('')+'</div>';
  h+='<div class="card"><h3>Session</h3><div class="two"><div><label for="f-min">운동 시간(분)</label><input id="f-min" type="number" inputmode="numeric" min="0" placeholder="90" data-f="minutes" value="'+esc(d.minutes)+'"></div>'+
    '<div><label for="f-wt">체중(kg)</label><input id="f-wt" type="number" inputmode="decimal" step="0.1" placeholder="65.0" data-f="weight" value="'+esc(d.weight)+'"></div>'+
    '<div><label for="f-top">오늘 최고 난이도</label><input id="f-top" type="text" placeholder="V4 / 5.11a" data-f="topGrade" value="'+esc(d.topGrade)+'"></div>'+
    '<div><label for="f-sends">완등 수</label><input id="f-sends" type="number" inputmode="numeric" min="0" placeholder="8" data-f="sends" value="'+esc(d.sends)+'"></div></div>'+
    '<div class="cond" style="margin-top:8px"><label>운동 강도</label>'+rateHtml('rpe',d.rpe)+'</div><div class="sub">강도 1 가벼움 · 5 한계</div></div>';
  h+='<div class="card"><h3>통증 · 불편 부위</h3><div class="chips">'+PAIN.map(function(x){return '<button type="button" data-chip="'+x+'" aria-pressed="'+((d.pain||[]).indexOf(x)>-1)+'">'+x+'</button>'}).join('')+'</div></div>';
  SECTIONS.forEach(function(s){
    h+='<div class="card"><h3>'+s.title+'</h3>';
    if(s.check)h+='<label class="check" style="margin-bottom:8px"><input type="checkbox" data-f="'+s.check[0]+'"'+(d[s.check[0]]?' checked':'')+'>'+s.check[1]+'</label>';
    h+='<div class="colhead"><span>종목</span><span>Set</span><span>Focus</span></div>';
    s.rows.forEach(function(r){var v=d.rows[r[0]]||{};
      h+='<div class="row"><div class="nm">'+r[1]+(r[2]?'<input type="text" aria-label="'+r[1]+' 종류" placeholder="종류/횟수" data-r="'+r[0]+'.type" value="'+esc(v.type)+'">':'')+'</div>'+
        '<input type="text" inputmode="numeric" aria-label="'+r[1]+' Set" placeholder="3" data-r="'+r[0]+'.set" value="'+esc(v.set)+'">'+
        '<input type="text" aria-label="'+r[1]+' Focus" placeholder="집중 포인트" data-r="'+r[0]+'.focus" value="'+esc(v.focus)+'"></div>'});
    h+='</div>'});
  h+='<div class="card"><h3>Today’s notes</h3><textarea id="f-notes" data-f="notes" placeholder="오늘 운동 느낌, 통증, 다음 목표">'+esc(d.notes)+'</textarea></div>';
  if(admin||d.coach)h+='<div class="card coach"><h3>코치 피드백</h3>'+(admin?'<textarea id="f-coach" data-f="coach" placeholder="회원에게 남길 피드백">'+esc(d.coach)+'</textarea>':'<div style="white-space:pre-wrap">'+esc(d.coach)+'</div>')+'</div>';
  h+='<div id="statusbox">'+statusHtml()+'</div>';
  h+='<div class="card" style="display:grid;gap:8px"><button class="btn acc" data-act="confirm"'+(d.confirmedAt?' disabled':'')+'>'+
    (admin?(d.confirmedAt?'회원 확인 완료':'회원 본인 확인 대기 중'):(d.confirmedAt?'본인 확인 완료':'내가 작성한 내용이 맞아요 (본인 확인)'))+'</button>'+
    '<div class="save" id="savestate" aria-live="polite" style="text-align:center">'+esc(S.saveState)+'</div></div></div>';
  return h;
}

  }else{
    h+='<h2 style="margin-top:24px">관리자 로그인</h2><div class="card">'+(S.adminSet?'':'<div class="banner" style="margin:0 0 12px">처음이에요. 사용할 관리자 PIN을 정해 주세요 (6자 이상). 지금 정한 PIN이 관리자 PIN이 됩니다.</div>')+
      '<label class="sub" for="l-apin">관리자 PIN</label><input id="l-apin" type="password" autocomplete="current-password" style="margin:6px 0 14px"><button class="btn acc" data-act="adminlogin">'+(S.adminSet?'로그인':'PIN 정하고 시작')+'</button></div><p class="sub"><a href="#" data-act="membermode" style="color:var(--accent)">회원 로그인으로</a></p>';
  }
  return h+'</div>';
}
function viewToday(){S.date=S.date||TODAY;return '<h2>'+(S.date===TODAY?'오늘의 운동':pretty(S.date))+'</h2><div class="sub">'+(S.date===TODAY?pretty(TODAY):'지난 기록 수정 중 · <a href="#" data-act="gotoday" style="color:var(--accent)">오늘로</a>')+'</div>'+editorHtml()}
function viewHistory(){
  return '<h2>내 기록</h2>'+statsHtml(S.days)+'<div class="card">'+calendarHtml(S.days)+'<div class="sub" style="margin-top:10px">채워진 날 = 출석 · 테두리 = 기록만 있음 · 날짜를 누르면 수정</div></div>';
}
function viewMine(){return '<h2>내 일지</h2><div class="sub">관리자 본인의 운동 기록이에요.</div>'+statsHtml(S.days)+'<div class="card">'+calendarHtml(S.days)+'</div><div class="sub" style="margin-top:14px">'+pretty(S.date)+' 기록</div>'+editorHtml()}
function viewMembers(){
  var h='<h2>회원 관리</h2><div class="sub">회원을 누르면 모든 운동기록을 보고 수정할 수 있어요.</div>';
  if(!S.roster.length)h+='<div class="card"><p class="sub" style="margin:0">아직 등록한 회원이 없어요. 아래에서 회원번호와 이름을 등록하세요.</p></div>';
  S.roster.slice().sort(function(a,b){return a.name.localeCompare(b.name,'ko')}).forEach(function(m){
    h+='<button class="mem" data-mem="'+esc(m.id)+'"><span class="av">'+esc(m.name.charAt(0))+'</span><span class="t"><b>'+esc(m.name)+' <span class="sub">#'+esc(m.id)+'</span>'+(m.claimed?'':' <span class="pill warn">첫 로그인 전</span>')+'</b><span id="ms-'+esc(m.id)+'">불러오는 중…</span></span><span>›</span></button>'});
  h+='<div class="card"><h3>회원 등록</h3><label class="sub" for="a-bulk">한 줄에 한 명씩 &quot;회원번호 이름&quot;</label><textarea id="a-bulk" placeholder="15-001 김민준&#10;15-002 이서연" style="margin:6px 0 10px"></textarea><button class="btn acc" data-act="addmem">등록</button><p class="sub" style="margin:10px 0 0">회원은 번호와 이름으로 처음 로그인하면서 자기 PIN을 정해요.</p></div>';
  return h;
}
function viewMember(){
  var m=S.roster.filter(function(x){return x.id===S.target})[0]||{name:'회원'};
  return '<button class="btn ghost sm" data-act="back">‹ 회원 목록</button><h2>'+esc(m.name)+'</h2>'+statsHtml(S.days)+
   '<div class="card">'+calendarHtml(S.days)+'</div><div class="sub" style="margin-top:14px">'+pretty(S.date)+' 기록 · 관리자 수정 가능</div>'+editorHtml()+
   '<div class="card"><h3>회원 정보 관리 <span class="pill">#'+esc(S.target)+'</span></h3><label class="sub" for="e-name">이름</label><input id="e-name" type="text" value="'+esc(m.name)+'" style="margin:6px 0 10px"><div style="display:grid;gap:8px"><button class="btn ghost" data-act="rename">이름 저장</button><button class="btn ghost" data-act="resetpin">PIN 초기화 (다시 정하게 하기)</button><button class="btn ghost" data-act="delmem">'+(S.confirmDel?'정말 삭제할까요? 기록도 모두 사라져요 · 한 번 더 누르면 삭제':'회원 삭제')+'</button></div></div>';
}
var matrixCache={};var matrixUnsubs=[];
function viewMatrix(){
  var ds=monthDates(S.month);
  var h='<h2>출석표</h2><div class="card" style="padding-bottom:6px">'+'<div class="mnav"><button data-act="mprev" aria-label="이전 달">‹</button><span>'+monthLabel(S.month)+'</span><button data-act="mnext" aria-label="다음 달">›</button></div></div>';
  h+='<div class="matrix"><table><thead><tr><th class="nm">이름</th>'+ds.map(function(d){return '<th>'+(+d.slice(8))+'</th>'}).join('')+'<th class="tot">합계</th></tr></thead><tbody>';
  S.roster.slice().sort(function(a,b){return a.name.localeCompare(b.name,'ko')}).forEach(function(m){
    var map=matrixCache[m.id]||{};var tot=0;
    h+='<tr><td class="nm">'+esc(m.name)+'</td>'+ds.map(function(d){var e=map[d];var c=e&&e.attended?'a':(hasLog(e)?'l':'');if(c==='a')tot++;return '<td class="c"><i class="'+c+'"></i></td>'}).join('')+'<td class="tot">'+tot+'</td></tr>'});
  if(!S.roster.length)h+='<tr><td class="nm">—</td></tr>';
  return h+'</tbody></table></div><p class="sub">채운 칸 = 출석 · 테두리 = 기록만 있음</p>';
}
function loadAll(){
  return Promise.all([rpc('gb_members',{p_token:S.token}),rpc('gb_all_days',{p_token:S.token,p_from:'2020-01-01',p_to:'2100-01-01'})]).then(function(r){
    S.roster=r[0]||[];matrixCache={};(r[1]||[]).forEach(function(x){(matrixCache[x.num]=matrixCache[x.num]||{})[x.day]=x.data});
    if(!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#editor')))render(true);paintMemberStats()},fail);
}
function paintMemberStats(){
  S.roster.forEach(function(m){var el=document.getElementById('ms-'+m.id);if(!el)return;var map=matrixCache[m.id]||{};
    var last=Object.keys(map).filter(function(k){return hasLog(map[k])}).sort().pop();
    var un=Object.keys(map).filter(function(k){return hasLog(map[k])&&!map[k].confirmedAt}).length;
    el.textContent='이번 달 '+countMonth(map,TODAY.slice(0,7))+'회 출석 · '+(last?'최근 '+pretty(last):'기록 없음')+(un?' · 미확인 '+un:'')})
}

function render(fromMatrix){
  if(!S.ready){return}
  var role=activeRole();var body;
  if(!S.session){$app.innerHTML=viewLogin();return}
  if(S.loading){$app.innerHTML=topbar()+'<div class="card sub">불러오는 중…</div>'+tabsHtml();return}
  if(role==='admin'){
    if(S.tab!=='members'&&S.tab!=='matrix')S.tab='members';
    body=S.tab==='matrix'?viewMatrix():(S.target?viewMember():viewMembers());
  }else{
    if(S.tab!=='today'&&S.tab!=='history')S.tab='today';
    body=S.tab==='history'?viewHistory()+'<div class="sub" style="margin:14px 0 0">'+pretty(S.date)+' 기록</div>'+editorHtml():viewToday();
  }
  var sy=window.scrollY;
  $app.innerHTML=topbar()+body+tabsHtml();
  if(role==='admin'&&!S.target&&S.tab==='members')paintMemberStats();
  if(fromMatrix)window.scrollTo(0,sy);
}

/* ---------- 이벤트 ---------- */
function setPath(obj,path,val){var p=path.split('.');var o=obj;for(var i=0;i<p.length-1;i++){o[p[i]]=o[p[i]]||{};o=o[p[i]]}o[p[p.length-1]]=val}
document.addEventListener('input',function(e){
  var t=e.target;if(!S.draft||!t.closest||!t.closest('#editor'))return;
  if(t.dataset.f){S.draft[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;touched()}
  else if(t.dataset.r){setPath(S.draft.rows,t.dataset.r,t.value);touched()}
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-tab],[data-date],[data-mem],[data-v],[data-chip]');if(!el)return;
  if(el.dataset.chip){var c=el.dataset.chip;var pl=S.draft.pain=S.draft.pain||[];
    if(c==='없음'){S.draft.pain=pl.indexOf(c)>-1?[]:['없음']}else{pl=pl.filter(function(x){return x!=='없음'});var i=pl.indexOf(c);if(i>-1)pl.splice(i,1);else pl.push(c);S.draft.pain=pl}
    [].forEach.call(el.parentNode.children,function(b){b.setAttribute('aria-pressed',String(S.draft.pain.indexOf(b.dataset.chip)>-1))});touched();return}
  if(el.dataset.v&&el.parentNode.dataset.rate){var k=el.parentNode.dataset.rate;var v=+el.dataset.v;
    var cur=k.indexOf('cond.')===0?S.draft.cond[k.slice(5)]:S.draft[k];var nv=cur===v?0:v;
    if(k.indexOf('cond.')===0)S.draft.cond[k.slice(5)]=nv;else S.draft[k]=nv;
    [].forEach.call(el.parentNode.children,function(b){b.setAttribute('aria-pressed',String(+b.dataset.v===nv))});touched();return}
  if(el.dataset.tab){flush();S.tab=el.dataset.tab;S.draftKey='';if(S.isAdmin){S.target=null;S.seq++;S.loading=false;loadAll();render()}else{S.date=(S.tab==='today')?TODAY:S.date;render()}window.scrollTo(0,0);return}
  if(el.dataset.date){flush();S.date=el.dataset.date;S.draftKey='';render();var ed=document.getElementById('editor');if(ed)ed.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(el.dataset.mem){flush();S.target=el.dataset.mem;S.date=TODAY;S.month=TODAY.slice(0,7);watchTarget();window.scrollTo(0,0);return}
  var a=el.dataset.act;
  if(a==='back'){flush();S.target=null;S.seq++;S.loading=false;S.confirmDel=false;loadAll();render()}
  else if(a==='mprev'||a==='mnext'){S.month=shiftMonth(S.month,a==='mnext'?1:-1);render(true)}
  else if(a==='gotoday'){e.preventDefault();flush();S.date=TODAY;S.draftKey='';render()}
  else if(a==='attend'){ensureDraft();var d=S.draft;d.attended=!d.attended;d.checkInAt=d.attended?Date.now():null;touched();render(true)}
  else if(a==='confirm'){ensureDraft();if(S.timer){clearTimeout(S.timer);S.timer=null}
    if(S.isAdmin)return;
    S.draft.confirmedAt=Date.now();S.draft.adminEditedAt=S.draft.adminEditedAt;doSave(viewUid(),S.date,S.draft);render(true)}
  else if(a==='adminmode'||a==='membermode'){e.preventDefault();S.loginMode=a==='adminmode'?'admin':'member';
    if(a==='adminmode')rpc('gb_admin_status').then(function(v){S.adminSet=!!v;render()},function(){render()});else render()}
  else if(a==='login'){var num=document.getElementById('l-num').value.trim(),nm=document.getElementById('l-name').value.trim(),pin=document.getElementById('l-pin').value.trim();
    if(!num||!pin){toast('회원번호와 PIN을 입력하세요');return}
    el.disabled=true;rpc('gb_login',{p_num:num,p_name:nm,p_pin:pin}).then(function(r){onLogin(r.token,{admin:false,num:r.num,name:r.name});if(r.first)toast('PIN이 설정됐어요. 다음부터 번호와 PIN으로 들어오세요')},function(er){el.disabled=false;if(er.code==='name_mismatch'&&!nm)toast('처음 로그인은 이름도 입력하세요');else toast(errText(er))})}
  else if(a==='adminlogin'){var ap=document.getElementById('l-apin').value.trim();if(!ap){toast('PIN을 입력하세요');return}
    el.disabled=true;rpc('gb_admin_login',{p_pin:ap}).then(function(r){onLogin(r.token,{admin:true});if(r.first)toast('관리자 PIN이 설정됐어요')},function(er){el.disabled=false;toast(errText(er))})}
  else if(a==='logout'){flush();rpc('gb_logout',{p_token:S.token}).then(forceLogout,forceLogout)}
  else if(a==='addmem'){var lines=document.getElementById('a-bulk').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);
    if(!lines.length){toast('회원번호와 이름을 입력하세요');return}
    var okn=0,bad=[];lines.reduce(function(p,l){return p.then(function(){var m=l.match(/^(\S+)[\s,]+(.+)$/);if(!m){bad.push(l);return}
      return rpc('gb_member_add',{p_token:S.token,p_num:m[1],p_name:m[2]}).then(function(){okn++},function(er){bad.push(l+' ('+errText(er)+')')})})},Promise.resolve())
      .then(function(){toast(okn+'명 등록'+(bad.length?' · 실패: '+bad.join(', '):''));return loadAll()})}
  else if(a==='rename'){var nn=document.getElementById('e-name').value.trim();if(!nn)return;
    rpc('gb_member_edit',{p_token:S.token,p_num:S.target,p_name:nn,p_reset_pin:false,p_delete:false}).then(function(){toast('이름을 저장했어요');return loadAll()},fail)}
  else if(a==='resetpin'){rpc('gb_member_edit',{p_token:S.token,p_num:S.target,p_name:'',p_reset_pin:true,p_delete:false}).then(function(){toast('PIN을 초기화했어요. 회원이 번호와 이름으로 다시 정하게 됩니다');return loadAll()},fail)}
  else if(a==='delmem'){if(!S.confirmDel){S.confirmDel=true;render(true);return}
    rpc('gb_member_edit',{p_token:S.token,p_num:S.target,p_name:'',p_reset_pin:false,p_delete:true}).then(function(){S.confirmDel=false;S.target=null;toast('삭제했어요');return loadAll()},fail)}
});

/* ---------- 시작 ---------- */
function onLogin(token,sess){
  S.token=token;S.session=sess;S.isAdmin=!!sess.admin;S.uid=sess.admin?null:sess.num;S.me=sess.admin?null:{name:sess.name};
  try{localStorage.setItem('gb_tok',token)}catch(e){}
  S.target=null;S.date=TODAY;S.draftKey='';S.ready=true;
  if(S.isAdmin){S.tab='members';render();loadAll()}else{S.tab='today';watchTarget()}
}
function forceLogout(){
  S.token=null;S.session=null;S.isAdmin=false;S.uid=null;S.me=null;S.days={};S.draft=null;S.draftKey='';S.loginMode='member';
  try{localStorage.removeItem('gb_tok')}catch(e){}
  S.ready=true;render();
}
var tok=null;try{tok=localStorage.getItem('gb_tok')}catch(e){}
$app.innerHTML='<div class="center"><img class="hero" alt="" src="'+HERO+'"></div>';
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&/^l-/.test(e.target.id||'')){var b=document.querySelector('.center [data-act=login],.center [data-act=adminlogin]');if(b)b.click()}});
if(tok){
  rpc('gb_me',{p_token:tok}).then(function(m){onLogin(tok,m)},function(e){if(e&&e.code==='network'){S.ready=true;render();toast('인터넷 연결을 확인하세요')}else forceLogout()});
}else{S.ready=true;render()}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body></html>
